name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ClaudeUsageMonitor.sln

      - name: Build
        run: dotnet build ClaudeUsageMonitor.sln -c Release --no-restore

      - name: Test
        run: dotnet test ClaudeUsageMonitor.sln -c Release --no-build --logger "console;verbosity=normal"
